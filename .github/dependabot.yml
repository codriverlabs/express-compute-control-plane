version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      quarkus:
        patterns: ["io.quarkus*"]
      aws-sdk:
        patterns: ["software.amazon.awssdk*"]
      aws-cdk:
        patterns: ["software.amazon.awscdk*"]
    ignore:
      # Pinned to fabric8 7.x (Jackson 2.x line). kubernetes-server-mock 8.x
      # requires Jackson 3.x (tools.jackson package), but the actual
      # kubernetes-client runtime dependency in ecp-karpenter-support comes
      # transitively via quarkus-kubernetes-client (Quarkus BOM), which is
      # still on fabric8 6.x/7.x. Bumping the mock alone creates a Jackson
      # 2.x/3.x split that fails at runtime with NoClassDefFoundError:
      # tools/jackson/core/JacksonException. Revisit once the Quarkus BOM
      # ships a quarkus-kubernetes-client that pulls in fabric8 8.x by
      # default. See docs/design/fixes/dependabot-jersey-and-fabric8-triage.md
      - dependency-name: "io.fabric8:kubernetes-server-mock"
        versions: ["8.x"]

  - package-ecosystem: docker
    directory: /ecp-auth-proxy/src/main/docker
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /ecp-workload-identity-webhook/src/main/docker
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /ecp-karpenter-support/src/main/docker
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
