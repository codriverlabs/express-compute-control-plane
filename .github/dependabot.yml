version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      quarkus:
        patterns: ["io.quarkus*"]
      aws-sdk:
        patterns: ["software.amazon.awssdk*"]
      aws-cdk:
        patterns: ["software.amazon.awscdk*"]

  - package-ecosystem: docker
    directory: /ecp-auth-proxy/src/main/docker
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /ecp-workload-identity-webhook/src/main/docker
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /ecp-karpenter-support/src/main/docker
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
